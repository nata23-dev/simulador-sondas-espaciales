          - definition:
            - text: Documentado
            - link "ESA":
              - /url: https://sci.esa.int/web/cassini-huygens/35026-engineering
          - term: Antena de alta ganancia
          - definition: 4 m
          - definition:
            - text: Documentado
            - link "ESA":
              - /url: https://sci.esa.int/web/cassini-huygens/35026-engineering
          - term: Dimensiones
