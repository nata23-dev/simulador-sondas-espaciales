          - definition:
            - text: Documentado
            - link "ESA":
              - /url: https://sci.esa.int/web/cassini-huygens/35026-engineering
          - term: Propelente
          - definition: 3132 kg
          - definition:
            - text: Documentado
            - link "NASA/JPL vía PDS Atmospheres":
              - /url: https://atmos.nmsu.edu/data_and_services/atmospheres_data/Cassini/Cassini/1919-3644/6-20060328_CHARM_Webster.pdf
