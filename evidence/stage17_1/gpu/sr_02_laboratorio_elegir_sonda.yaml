          - term: Isp del motor principal
          - definition: ≈ 311 s (familia R-4D-11)
          - definition:
            - text: Fuente secundaria
            - link "L3Harris / Aerojet Rocketdyne, ficha de fabricante":
              - /url: https://www.l3harris.com/sites/default/files/2023-07/AJRD-LHX_Bipropellant_Rocket_Engines_SpecSheet_CMYK_061423_APPROVED.pdf
